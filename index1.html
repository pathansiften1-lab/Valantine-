<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>
<style>
  body {
    height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow: hidden;
  }

  h1 {
    margin-bottom: 20px;
  }

  .buttons {
    position: relative;
    width: 300px;
    height: 200px;
  }

  button {
    position: absolute;
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  #yes {
    background: #ff3366;
    color: white;
    left: 40px;
    top: 80px;
  }

  #no {
    background: #555;
    color: white;
    left: 160px;
    top: 80px;
  }
</style>
</head>

<body>

<h1>Hey <span id="name">Irene</span>… will you be my Valentine? 💘</h1>

<div class="buttons">
  <button id="yes">Yes 💖</button>
  <button id="no">No 😶</button>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const nameSpan = document.getElementById("name");

// Name already set to Irene 💓
nameSpan.innerText = "Irene 💓";

let yesScale = 1;

noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * 240;
  const y = Math.random() * 140;
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  yesScale += 0.15;
  yesBtn.style.transform = `scale(${yesScale})`;
});

yesBtn.addEventListener("click", () => {
  document.body.innerHTML = `
    <h1>Yayyy 💕</h1>
    <h2>You just made my day 🌸</h2>
    <p style="font-size:20px">Now you’re officially my Valentine 😌</p>
  `;
});
</script>

</body>
</html>
